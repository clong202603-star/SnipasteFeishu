name: Daily contributors

on:
  schedule:
    # 00:00 Asia/Shanghai
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh the contributor roster
        env:
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          DOUYIN_SEC_UID: ${{ secrets.DOUYIN_SEC_UID }}
          DOUYIN_UNIQUE_ID: ${{ secrets.DOUYIN_UNIQUE_ID }}
          DOUYIN_FOLLOWER_LIMIT: ${{ secrets.DOUYIN_FOLLOWER_LIMIT }}
        run: python3 followers/update_followers.py

      - name: Commit the roster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md followers
          if git diff --cached --quiet; then
            echo "The roster is unchanged"
            exit 0
          fi
          git commit -m "Update the contributor roster for $(TZ=Asia/Shanghai date +%F)"
          git push
