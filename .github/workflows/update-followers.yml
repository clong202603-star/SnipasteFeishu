name: 每日粉丝清单

on:
  schedule:
    # 北京时间 0:00
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 拉取当天粉丝清单
        env:
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          DOUYIN_SEC_UID: ${{ secrets.DOUYIN_SEC_UID }}
          DOUYIN_UNIQUE_ID: ${{ secrets.DOUYIN_UNIQUE_ID }}
          DOUYIN_FOLLOWER_LIMIT: ${{ secrets.DOUYIN_FOLLOWER_LIMIT }}
        run: python3 followers/update_followers.py

      - name: 提交清单
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add followers
          if git diff --cached --quiet; then
            echo "清单没有变化"
            exit 0
          fi
          git commit -m "更新 $(TZ=Asia/Shanghai date +%F) 粉丝清单"
          git push
